name: Versapp Demo APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version enviada por Versapp
        default: '1.0.0'
        type: string
      entorno:
        description: Entorno dev, qa, stg o prod
        default: dev
        type: string
      build_numero:
        description: Numero de build enviado por Versapp
        default: '1'
        type: string
      build_id:
        description: ID de build pendiente de Versapp (vacio para solo descargar APK)
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_VERSION: ${{ inputs.version || '1.0.0' }}
      DEMO_BUILD: ${{ inputs.build_numero || github.run_number }}
      DEMO_ENVIRONMENT: ${{ inputs.entorno || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de prueba
        run: gradle --no-daemon :app:assembleDebug "-PdemoVersion=$DEMO_VERSION" "-PdemoBuild=$DEMO_BUILD" "-PdemoEnvironment=$DEMO_ENVIRONMENT"
      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: versapp-demo-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enviar a Versapp si la build fue solicitada desde la aplicacion
        if: github.event_name == 'workflow_dispatch' && inputs.build_id != ''
        env:
          VERSAPP_URL: ${{ secrets.VERSAPP_URL }}
          VERSAPP_API_KEY: ${{ secrets.VERSAPP_API_KEY }}
          BUILD_ID: ${{ inputs.build_id }}
        run: python3 scripts/versapp_upload.py
